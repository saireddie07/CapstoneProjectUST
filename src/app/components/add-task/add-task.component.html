
<h2>Add New Task</h2>
<form [formGroup]="addTaskForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="taskTitle">Task Title</label>
    <input type="text" class="form-control" id="taskTitle" formControlName="taskTitle">
  </div>
  <div class="form-group">
    <label for="taskDescription">Task Description</label>
    <textarea class="form-control" id="taskDescription" formControlName="taskDescription"></textarea>
  </div>
  <div class="form-group">
    <label for="taskAssignedDate">Assigned Date</label>
    <input type="date" class="form-control" id="taskAssignedDate" formControlName="taskAssignedDate">
  </div>
  <div class="form-group">
    <label for="taskDeadline">Deadline</label>
    <input type="date" class="form-control" id="taskDeadline" formControlName="taskDeadline">
  </div>
  <div class="form-group">
    <label for="taskAssignedTo">Assigned To</label>
    <input type="text" class="form-control" id="taskAssignedTo" formControlName="userName">
  </div>
  <button type="submit" class="submit-btn">
    <i class="fas fa-plus"></i> Add Task
  </button>
</form>
